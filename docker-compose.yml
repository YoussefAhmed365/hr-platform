services:
  postgres:
    image: postgres:16-alpine
    container_name: hr_saas_postgres
    restart: always
    environment:
      POSTGRES_USER: hr_admin
      POSTGRES_PASSWORD: hr_secret_password
      POSTGRES_DB: hr_saas_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hr_saas_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: